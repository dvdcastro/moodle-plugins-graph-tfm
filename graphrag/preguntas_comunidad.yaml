    MATCH (p:Plugin {component: 'mod_attendanceregister'})
    RETURN p.component AS component, p.supported_releases AS soportadas,
           EXISTS { (p)-[:SUPPORTS]->(:MoodleRelease {release: '3.6'}) } AS declara_36
  respuesta_ref: "mod_attendanceregister NO declara 3.6 (declara 2.1-3.3, 4.0, 4.1 y 4.5). La viabilidad de usarlo igualmente no está en el grafo."
