  respuesta_ref: "Hay señales claras de abandono: la última release de block_rss_thumbnails es del 2023-02-02 (versión 1.3), declara soporte solo hasta 4.1 y tiene 39 instalaciones. Tiene 3 mantenedores (Camille Carlier, Martin Cornu-Mansuy, Laurent David); en el índice de riesgo cuenta como estancado, no como mantenedor único. Declararlo «abandonado» es una inferencia: no hay campo de archivado."
