- id: P02
  clase: P
  fuente: https://moodle.org/mod/forum/discuss.php?d=418717
  autor: Claudine Crews (2021-02-23)
  idioma: en
  origen: adaptada
  pregunta: "Which actively maintained, widely installed themes could replace theme_essential on a recent Moodle version?"
  ref_cypher: |
    OPTIONAL MATCH (e:Plugin {component: 'theme_essential'})
    WITH e IS NOT NULL AS essential_en_grafo
    MATCH (p:Plugin {plugin_type: 'theme'})-[:SUPPORTS]->(:MoodleRelease {release: '5.0'})
    WHERE p.last_release_ts > 1720000000
    RETURN essential_en_grafo, p.component AS component, p.installations AS instalaciones, p.max_supported_release AS max_soportada
    ORDER BY instalaciones DESC LIMIT 10
  respuesta_ref: "theme_essential no está en el snapshot (ni su mantenedor, Gareth Barnard, aparece en el grafo). Temas que declaran 5.0 con release desde julio de 2024, por instalaciones: theme_moove (27.596), theme_academi (12.450), theme_boost_union (8.896), theme_trema (4.462), theme_almondb (3.566), theme_mb2nl, theme_lambda2... «Smoothest, least error-prone» no es observable."
  respondible: parcial
  criterio: "Sin conjunto de citas (recomendación abierta). Correcta si recomienda al menos uno de los temas mantenidos y muy instalados (p. ej. theme_moove, theme_academi, theme_boost_union) con datos del grafo. Parcial si recomienda temas poco instalados o sin indicar mantenimiento. Incorrecta si inventa datos sobre theme_essential o recomienda temas abandonados como si estuvieran activos."

- id: P03
  clase: P
  fuente: https://moodle.org/mod/forum/discuss.php?d=391003
  autor: Dan Baker (2019-09-15)
  idioma: en
  origen: adaptada
  pregunta: "Which published plugins declare a dependency on local_aws, and what versions of local_aws exist?"
  gold: [local_aws, local_session_dynamodb, tool_emailutils, tool_s3logs]
  gold_cypher: |
    MATCH (p:Plugin {component: 'local_aws'})
    RETURN p.component AS component, p.latest_version AS version, p.supported_releases AS soportadas, 'objetivo' AS rol
    UNION
    MATCH (a:Plugin)-[d:DEPENDS_ON]->(:Plugin {component: 'local_aws'})
    RETURN a.component AS component, d.required_version AS version, a.supported_releases AS soportadas, 'dependiente' AS rol
  respuesta_ref: "Declaran dependencia de local_aws: local_session_dynamodb, tool_emailutils y tool_s3logs. De local_aws el grafo guarda solo la última versión (2024050801, 2024-05-08; soporte 2.6-4.3), no el historial."
  respondible: parcial
  criterio: "Correcta si nombra los 3 dependientes (o al menos 2 sin inventar otros) y la última versión de local_aws o que solo consta la última. Parcial si nombra 1-2 dependientes o solo la versión. Incorrecta si inventa dependientes."

- id: P04
  clase: P
  fuente: https://moodle.org/mod/forum/discuss.php?d=417684
  autor: Andrew Hancox (2021-02-03)
  idioma: en
  origen: adaptada
  pregunta: "How widely installed are mod_customcert and tool_certificate, who maintains each one, and do they share maintainers?"
  gold: [mod_customcert, tool_certificate]
  gold_cypher: |
    MATCH (p:Plugin) WHERE p.component IN ['mod_customcert', 'tool_certificate']
    OPTIONAL MATCH (m:Maintainer)-[:MAINTAINS]->(p)
    RETURN p.component AS component, p.installations AS instalaciones, collect(m.display_name) AS mantenedores,
           EXISTS { (:Plugin {component: 'mod_customcert'})-[:CO_MAINTAINED]-(:Plugin {component: 'tool_certificate'}) } AS comparten
  respuesta_ref: "mod_customcert: 31.808 instalaciones, mantenido por Mark Nelson. tool_certificate: 9.953 instalaciones, mantenido por «Moodle Workplace plugins». No comparten mantenedores (sin arista CO_MAINTAINED; comunidades Louvain distintas)."
  respondible: parcial
  criterio: "Correcta si da instalaciones y mantenedores de ambos y dice que no comparten. Parcial si falta un elemento. Incorrecta si da cifras o mantenedores falsos o dice que comparten."

- id: P05
  clase: P
  fuente: https://moodle.atlassian.net/browse/MDLSITE-7364
  autor: Gareth Barnard (2023-09-27)
  idioma: en
  origen: adaptada
  pregunta: "Which of Gareth Barnard's plugins (e.g. format_weekcoll) are no longer actively maintained?"
  ref_cypher: |
    OPTIONAL MATCH (m:Maintainer) WHERE toLower(m.display_name) CONTAINS 'barnard'
    OPTIONAL MATCH (p:Plugin {component: 'format_weekcoll'})
    RETURN count(m) AS mantenedores_barnard, p IS NOT NULL AS weekcoll_en_grafo
  respuesta_ref: "En el snapshot del 2026-09-07 no hay ningún mantenedor «Gareth Barnard» ni está format_weekcoll (tampoco format_topcoll, format_grid ni theme_essential): sus plugins ya no figuran en el directorio. El grafo no puede listar cuáles están sin mantener; lo correcto es decir que no constan."
  respondible: "no"
  criterio: "Abstención correcta si dice que no encuentra plugins de Gareth Barnard / format_weekcoll. Incorrecta si atribuye a Barnard plugins de otros mantenedores."

- id: P06
  clase: P
  fuente: https://github.com/Laboratoire-de-Chemoinformatique/moodle-atto_molstructure/issues/3
  autor: Richardvi (2023-10-27)
  idioma: en
  origen: adaptada
  pregunta: "Is there a TinyMCE (tiny_*) equivalent of atto_molstructure, by the same maintainers or otherwise?"
  gold: [atto_molstructure, tiny_molstructure]
  gold_cypher: |
    MATCH (a:Plugin {component: 'atto_molstructure'})
    RETURN a.component AS component, a.max_supported_release AS max_soportada, [] AS mantenedores_comunes
    UNION
    MATCH (m:Maintainer)-[:MAINTAINS]->(:Plugin {component: 'atto_molstructure'})
    MATCH (m)-[:MAINTAINS]->(t:Plugin) WHERE t.component STARTS WITH 'tiny_'
    RETURN t.component AS component, t.max_supported_release AS max_soportada, collect(m.display_name) AS mantenedores_comunes
  respuesta_ref: "Sí: tiny_molstructure («Chemical substance»), de los mismos mantenedores (Céline Pervès y Louis Plyer); declara 3.10-5.1, última release 2025-02-27. atto_molstructure solo llega a 4.1. (Otros tiny_ relacionados con química por texto: tiny_ketcher, tiny_wiris.)"
  respondible: si
  criterio: "Correcta si nombra tiny_molstructure como equivalente. Parcial si propone otro tiny_ químico (tiny_ketcher, tiny_wiris) sin tiny_molstructure. Incorrecta si inventa uno."

- id: P07
  clase: P
  fuente: https://github.com/ndunand/moodle-mod_choicegroup/issues/282
  autor: moodlexabi (2026-07-16)
  idioma: en
  origen: adaptada
  pregunta: "Is mod_choicegroup still listed in the plugins directory, and when was its last release?"
  gold: [mod_choicegroup]
  gold_cypher: |
    MATCH (p:Plugin {component: 'mod_choicegroup'})
    OPTIONAL MATCH (m:Maintainer)-[:MAINTAINS]->(p)
    RETURN p.component AS component, p.in_directory AS en_directorio, p.latest_release AS release,
           toString(date(datetime({epochSeconds: p.last_release_ts}))) AS ultima, collect(m.display_name) AS mantenedores
  respuesta_ref: "Sí, en el snapshot del 2026-09-07 mod_choicegroup está en el directorio; última release del 2026-02-05 (soporte hasta 5.1), mantenido por Nicolas Dunand y CSE Université de Lausanne; ningún plugin declara depender de él. El motivo de la retirada temporal no es observable."
  respondible: parcial
  criterio: "Correcta si confirma que está listado y da la fecha 2026-02-05. Parcial si solo una de las dos."

- id: P08
  clase: P
  fuente: https://github.com/UNIMOODLE/moodle-local_notificationsagent/issues/169
  autor: lucascomerci (2025-05-16)
  idioma: es
  origen: adaptada
  pregunta: "¿Está local_notificationsagent en el directorio de plugins y, si está, quién lo mantiene y cuándo fue su última versión?"
  gold: [local_notificationsagent]
  gold_cypher: |
    MATCH (p:Plugin {component: 'local_notificationsagent'})
    OPTIONAL MATCH (m:Maintainer)-[:MAINTAINS]->(p)
    RETURN p.component AS component, p.in_directory AS en_directorio, p.latest_maturity AS madurez,
           toString(date(datetime({epochSeconds: p.last_release_ts}))) AS ultima, collect(m.display_name) AS mantenedores
  respuesta_ref: "Sí: local_notificationsagent está en el directorio; mantenedores Juan Pablo de Castro, UNIMOODLE Consortium e ISYC Soporte; última versión del 2025-07-29 (madurez beta); 281 instalaciones."
  respondible: si
  criterio: "Correcta si confirma presencia, mantenedores y fecha. Parcial si falta uno de los tres."

