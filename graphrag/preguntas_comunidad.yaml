# Preguntas libres redactadas por miembros de la comunidad Moodle (no por el autor).
# Origen: intercambio/salida/v3/preguntas_comunidad_candidatas.md (34 candidatas,
# recolectadas el 2026-10-04). Se excluye P09 (publicada el 2026-09-11, después
# del snapshot del 2026-09-07): quedan 33.
#
# Ejecutar: ../.venv/bin/python 08_preguntas_libres.py preguntas_comunidad.yaml
# Evaluar:  ../.venv/bin/python 09_eval_comunidad.py
#
# Texto de la pregunta:
#   origen=adaptada            -> «pregunta adaptada» del fichero de candidatas, tal cual.
#   origen=literal             -> texto literal (título + cuerpo), sin traducir ni corregir erratas.
#   origen=literal+contexto    -> texto literal que solo dice «this plugin»; se antepone, de forma
#                                 mecánica, el repositorio de GitHub donde se publicó la issue
#                                 (lo que el lector de la issue veía). Es la única intervención
#                                 añadida por el evaluador; no se reformula nada más.
#
# Gold (escrito y congelado ANTES de ejecutar ningún sistema; sha256 en
# preguntas_comunidad.sha256):
#   gold_cypher  consulta de solo lectura escrita a mano; devuelve `component` (citas esperadas)
#                y las columnas de hechos de las que sale respuesta_ref. 08 la ejecuta.
#   gold         citas esperadas explícitas (deben coincidir con gold_cypher; 08 avisa si no).
#   ref_cypher   consulta de hechos para preguntas SIN conjunto de citas esperado (plugin ausente
#                del snapshot, consultas agregadas). 08 no la lee; 09 --gold la ejecuta y la guarda.
#   respuesta_ref respuesta de referencia derivada de esas consultas (snapshot 2026-09-07).
#   respondible  si / parcial / no, según el grafo (puede diferir de la clase a priori del
#                recolector: p. ej. C06 y C08 resultan no respondibles porque el plugin no está).
#   criterio     reglas de juicio fijadas a priori para los casos dudosos.
#
# No se usa `seed`: en estas preguntas el plugin nombrado ES la cita esperada (en T1-T5 la
# respuesta era una lista de OTROS plugins y por eso se excluía la semilla).
# Madurez en el grafo: 50 alpha, 100 beta, 150 RC, 200 estable.

preguntas:

# ----------------------------------------------------------------- A. Completas (19)

- id: C01
  clase: C
  fuente: https://moodle.org/mod/forum/discuss.php?d=417710
  autor: Peter Diedrichs (2021-02-04)
  idioma: en
  origen: adaptada
  pregunta: "Is the Dialogue plugin (mod_dialogue) still maintained, and does it support Moodle 3.9 or later?"
  gold: [mod_dialogue]
  gold_cypher: |
    MATCH (p:Plugin {component: 'mod_dialogue'})
    OPTIONAL MATCH (m:Maintainer)-[:MAINTAINS]->(p)
    RETURN p.component AS component, p.supported_releases AS soportadas,
           p.latest_version AS version, toString(date(datetime({epochSeconds: p.last_release_ts}))) AS ultima,
           collect(m.display_name) AS mantenedores
  respuesta_ref: "Sí: mod_dialogue tuvo release el 2025-03-19 (versión 2025032000), declara soporte para 3.9 y de 3.10 a 4.5, y tiene un único mantenedor (Dan Marsden). No está estancado (índice de riesgo: mantenedor único, sin estancamiento)."
  respondible: si
  criterio: "Correcta si afirma que sigue con releases recientes (2025) Y que soporta 3.9 o posteriores. Parcial si solo responde una de las dos partes."

- id: C02
  clase: C
  fuente: https://moodle.org/mod/forum/discuss.php?d=422640
  autor: Mark Sharp (2021-05-25)
  idioma: en
  origen: adaptada
  pregunta: "Has block_massaction been abandoned (single maintainer, no release in 3 years)? How exposed are the sites that use it?"
  gold: [block_massaction]
  gold_cypher: |
    MATCH (p:Plugin {component: 'block_massaction'})
    OPTIONAL MATCH (m:Maintainer)-[:MAINTAINS]->(p)
    RETURN p.component AS component, p.installations AS instalaciones,
           toString(date(datetime({epochSeconds: p.last_release_ts}))) AS ultima,
           p.max_supported_release AS max_soportada, collect(m.display_name) AS mantenedores
  respuesta_ref: "No, en el snapshot no está abandonado: block_massaction tiene release del 2026-07-28 (v8.0.1), soporta hasta 5.2 y tiene un único mantenedor (Matt Davidson); 2.313 instalaciones. Hubo adopción: el riesgo actual es de mantenedor único, no de estancamiento."
  respondible: si
  criterio: "Correcta si dice que tiene release reciente (2026) y por tanto no está abandonado; mencionar el mantenedor único o las instalaciones es un plus. Incorrecta si afirma que está abandonado o sin releases."

- id: C03
  clase: C
  fuente: https://moodle.org/mod/forum/discuss.php?d=417869
  autor: Paul L (2021-02-05)
  idioma: en
  origen: adaptada
  pregunta: "Blackboard ILP Integration requires the Open LMS Framework plugin. Which Moodle versions does Open LMS Framework support, and is it a dependency of other plugins?"
  gold: [local_mr, block_flexpagenav, block_internships, format_flexpage, format_folderview, plagiarism_safeassign]
  gold_cypher: |
    MATCH (p:Plugin {component: 'local_mr'})
    RETURN p.component AS component, p.name AS nombre, p.supported_releases AS soportadas, p.latest_release AS release, 'framework' AS rol
    UNION
    MATCH (a:Plugin)-[:DEPENDS_ON]->(:Plugin {component: 'local_mr'})
    RETURN a.component AS component, a.name AS nombre, a.supported_releases AS soportadas, a.latest_release AS release, 'dependiente' AS rol
  respuesta_ref: "Open LMS Framework es local_mr: declara 2.3, 2.8, 3.0-3.2, 3.7, 3.9-3.11, 4.0, 4.1, 4.3-4.5 y 5.1 (release 5.1.4, 2026-07-23). Sí es dependencia de 5 plugins: format_flexpage, block_flexpagenav, format_folderview, plagiarism_safeassign y block_internships. La última versión de ILP Integration (block_intelligent_learning) ya NO declara dependencia de local_mr (solo de mod_lesson, mod_assign y mod_quiz)."
  respondible: si
  criterio: "Correcta si identifica local_mr, da versiones soportadas recientes (hasta 5.1) y nombra al menos parte de sus dependientes. Parcial si solo da una de las dos partes. Incorrecta si atribuye dependientes o versiones falsas."

- id: C04
  clase: C
  fuente: https://moodle.org/mod/forum/discuss.php?d=434490
  autor: Oli Alonso (2022-05-13)
  idioma: es
  origen: adaptada
  pregunta: "Dada una lista de plugins instalados, ¿cuáles declaran soporte para Moodle 4.0 y cuáles no?"
  ref_cypher: |
    MATCH (p:Plugin) WHERE p.in_directory
    RETURN count(p) AS total,
           sum(CASE WHEN EXISTS { (p)-[:SUPPORTS]->(:MoodleRelease {release: '4.0'}) } THEN 1 ELSE 0 END) AS declaran_40
  respuesta_ref: "La pregunta adaptada no incluye la lista. El grafo lo resuelve por plugin con las versiones soportadas declaradas (relación SUPPORTS / supported_releases): en el snapshot, 1.082 de los 2.888 plugins del directorio declaran soporte para 4.0."
  respondible: parcial
  criterio: "Fijado a priori: correcta si explica que se comprueba con las versiones declaradas por plugin y da el recuento o una clasificación correcta; parcial si pide la lista o da ejemplos sin método; abstención incorrecta si solo dice que no puede; incorrecta si da datos de soporte falsos."

- id: C05
  clase: C
  fuente: https://moodle.atlassian.net/browse/MDLSITE-7953
  autor: Arielle Fariñas (2025-02-18)
  idioma: en
  origen: adaptada
  pregunta: "List all plugins in the directory with the category each one belongs to."
  ref_cypher: |
    MATCH (p:Plugin)-[:IN_CATEGORY]->(c:Category)
    RETURN count(p) AS plugins, count(DISTINCT c) AS categorias
  respuesta_ref: "El grafo tiene la relación IN_CATEGORY para los 2.888 plugins del directorio, en 52 categorías. Una respuesta completa es un listado de 2.888 filas; ningún contexto de 20 fichas ni 100 filas lo cubre."
  respondible: si
  criterio: "Fijado a priori: correcta solo si entrega el listado completo; parcial si da un listado parcial con categorías correctas o explica que el dato existe pero solo muestra una parte; abstención incorrecta si solo dice que no puede; incorrecta si asigna categorías falsas."

